# nginx dentro del contenedor del frontend.
# Sirve la aplicación compilada y reenvía al backend SOLO las rutas públicas de la API.
# /internal/ (el ingest del worker) NO se reenvía: solo es alcanzable dentro de la red de contenedores.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Los archivos compilados llevan un hash en el nombre: se pueden guardar para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # El HTML nunca se guarda en caché: así una versión nueva se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API pública (la misma que usa `make dev` en el puerto 8001).
    location ~ ^/(servicios|chequeos|incidentes|badge|health)(/|$) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Tiempo real (WebSocket).
    location = /ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /internal/ {
        return 404;
    }

    # La interfaz usa rutas con # (#/incidentes), pero por si acaso cualquier otra ruta cae en la aplicación.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
