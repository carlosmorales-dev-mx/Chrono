# Chrono COMPLETO en contenedores: PostgreSQL + backend + worker + frontend (nginx).
#
#   make stack         construye las imágenes y lo levanta todo   ->  http://localhost:8080
#   make stack-logs    sigue los logs
#   make stack-down    lo detiene (los datos quedan en el volumen chrono_pgdata)
#
# Es independiente de podman-compose.yml (que solo levanta PostgreSQL para `make dev`): usa otro volumen, otros
# nombres y no publica el puerto de la base, así que puedes tener los dos a la vez.
# Los secretos salen de backend/.env y worker/.env (que ya tienes); aquí solo se sobrescribe lo que cambia
# dentro de la red de contenedores: la dirección de la base y la del backend.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: chrono_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - chrono_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: chrono_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse}@db:5432/${POSTGRES_DB:-pulse}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./worker
      dockerfile: Containerfile
    container_name: chrono_worker
    restart: unless-stopped
    env_file:
      - ./worker/.env
    environment:
      BACKEND_URL: http://backend:8001
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
      args:
        VITE_API_URL: ""
    container_name: chrono_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  chrono_pgdata:
