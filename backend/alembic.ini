# Configuración de Alembic (migraciones de la base de datos). Se usa desde backend/:
#   python -m alembic upgrade head        aplica todas las migraciones pendientes
#   python -m alembic current             muestra en qué versión está la base
#   python -m alembic revision --autogenerate -m "describe el cambio"     (o:  make revision m="…")
# La URL de la base NO va aquí: migrations/env.py la toma de DATABASE_URL (backend/.env).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
